spring.application.name=quantumtech-backend

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/qtechdb}
spring.data.mongodb.database=${MONGODB_DATABASE:qtechdb}

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

app.admin.email=${ADMIN_EMAIL:admin@quantumtech.com}
app.admin.password=${ADMIN_PASSWORD}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.owner.notification-email=${OWNER_NOTIFICATION_EMAIL:}
app.reset-base-url=${RESET_BASE_URL:http://localhost:8080/reset-password}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Checkout / order tracking (Tahsan)
# Public order lookups (tracking, payment resubmission) allowed per client IP per window.
app.tracking.max-attempts=${TRACKING_MAX_ATTEMPTS:10}
app.tracking.window-minutes=${TRACKING_WINDOW_MINUTES:15}
# Behind a hosting proxy (Render, Railway, Nginx) set FORWARD_HEADERS_STRATEGY=framework so the
# rate limiter sees the real client IP instead of the proxy IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
