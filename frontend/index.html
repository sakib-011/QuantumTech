    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- SEO & Metadata -->
    <title>QuantumTech | Modern Tech Accessories in Bangladesh</title>
    <meta name="description" content="Shop verified chargers, premium audio, protective cases, power banks, and smart accessories in Bangladesh. Cash on Delivery, fast bKash &amp; Nagad payments." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QuantumTech | Premium Tech Accessories" />
    <meta property="og:description" content="Quality tech accessories at fair prices, delivered across Bangladesh. Cash on Delivery available." />

    <!-- Google Fonts: Inter (English) and Noto Sans Bengali (Bangla) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Zero-Flash Theme Initializer -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('quantum_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-alt text-ink antialiased selection:bg-quantum-soft selection:text-quantum">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
